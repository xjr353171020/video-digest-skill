[project]
name = "video-digest-skill"
version = "0.1.0"
description = "A Codex skill for evidence-grounded video digests"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2026.7.4",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["网页ChatGPT生成-video-digest-codex-skill-v3"]
